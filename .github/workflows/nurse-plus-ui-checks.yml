name: Nurse+ UI checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check navigation JavaScript syntax
        run: |
          node --check assets/js/new-bottom-navigation.js
          node --check assets/js/new-navigation-animation.js
          node --check assets/js/new-home-layout.js
          node --check assets/js/new-settings-layout.js
          node --check assets/js/new-notice-layout.js
      - name: Check HTML structure markers and script/style references
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [
            'assets/css/new-bottom-navigation.css',
            'assets/css/new-home-layout.css',
            'assets/css/new-settings-layout.css',
            'assets/css/new-notice-layout.css',
            'assets/js/new-navigation-animation.js',
            'assets/js/new-home-layout.js',
            'assets/js/new-settings-layout.js',
            'assets/js/new-notice-layout.js',
            'assets/js/new-bottom-navigation.js'
          ];
          for (const ref of refs) {
            if (!html.includes(ref)) throw new Error('Missing reference: ' + ref);
          }
          console.log('All new Nurse+ UI assets are referenced.');
          NODE
