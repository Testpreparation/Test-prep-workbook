
name: LINE Test Notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message to my LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TEST_USER_ID: ${{ secrets.LINE_TEST_USER_ID }}
        run: |
          set -euo pipefail

          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ] || [ -z "$LINE_TEST_USER_ID" ]; then
            echo "Required GitHub Secrets are missing."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          payload = {
              "to": os.environ["LINE_TEST_USER_ID"],
              "messages": [{
                  "type": "text",
                  "text": "【Nurse+】LINE通知のテストです。正常に受信できたら設定確認完了です。"
              }]
          }

          request = urllib.request.Request(
              "https://api.line.me/v2/bot/message/push",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + os.environ["LINE_CHANNEL_ACCESS_TOKEN"]
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("LINE API HTTP status:", response.status)
                  if response.status != 200:
                      raise SystemExit("LINE test failed.")
          except urllib.error.HTTPError as error:
              print("LINE API HTTP status:", error.code)
              raise SystemExit("LINE test failed. Check LINE settings.")
          PY
