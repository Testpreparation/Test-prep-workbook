name: LINE Auto Notice

on:
  schedule:
    # 毎日午前9時（JST）に実行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run LINE notice script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          node scripts/line-notice.js

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add line-notice-state.json
          git diff --staged --quiet || (git commit -m "Chore: Update LINE notice state [skip ci]" && git push)
