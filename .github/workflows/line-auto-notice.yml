```yaml
name: LINE Auto Notice

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: line-auto-notice
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check LINE settings
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          set -e
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "::error::LINE_CHANNEL_ACCESS_TOKEN が設定されていません。"
            exit 1
          fi
          echo "LINE_NOTICE_MODE=production"

      - name: Run LINE notice script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TEST_USER_ID: ${{ secrets.LINE_TEST_USER_ID }}
          LINE_NOTICE_MODE: production
        run: node scripts/line-notice.js

      - name: Save notification state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add line-notice-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update LINE notice state [skip ci]"
            git push
          fi
```
