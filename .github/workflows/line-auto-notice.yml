
name: LINE Auto Notice

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nurseplus-line-production
  cancel-in-progress: false

jobs:
  notify:
    name: Check and send published notices
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Print execution diagnostics
        run: |
          set -euo pipefail
          echo "NURSEPLUS_LINE_STARTED"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Branch: $GITHUB_REF_NAME"
          echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

      - name: Validate configuration
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          FIREBASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$LINE_TOKEN" || {
            echo "::error::LINE_CHANNEL_ACCESS_TOKEN is missing."
            exit 1
          }
          test -n "$FIREBASE_URL" || {
            echo "::error::FIREBASE_DATABASE_URL is missing."
            exit 1
          }
          echo "Configuration check passed."

      - name: Process notices
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          LINE_NOTICE_MODE: production
        run: node scripts/line-notice.js

      - name: Save history
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add line-notice-state.json

          if git diff --cached --quiet; then
            echo "No history changes."
            exit 0
          fi

          git commit -m "Update LINE notice history [skip ci]"
          git push origin HEAD:main
