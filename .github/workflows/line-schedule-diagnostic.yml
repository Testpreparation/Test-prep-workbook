name: LINE Schedule Diagnostic

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check automatic execution
        run: |
          echo "SCHEDULE_DIAGNOSTIC_STARTED"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Branch: $GITHUB_REF_NAME"
          echo "UTC time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "SCHEDULE_DIAGNOSTIC_FINISHED"
