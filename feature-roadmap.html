<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7ff">
<title>Nurse＋ 機能追加ロードマップ</title>
<style>
:root{--ink:#202b40;--muted:#68758a;--line:#e3e8f2;--blue:#4b66e8;--green:#17865d;--amber:#a96700;--red:#c04444}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:820px;margin:auto;padding:20px 14px 40px}
.hero{padding:23px;border-radius:22px;background:linear-gradient(135deg,#e9edff,#fff);border:1px solid #dfe5ff}
h1{font-size:1.45rem;margin:0 0 9px}p{color:var(--muted);line-height:1.65;margin:6px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
button{font:inherit;font-weight:650;border:0;border-radius:12px;padding:11px 14px;cursor:pointer}
.primary{background:var(--blue);color:#fff}.soft{background:#e9edf6;color:var(--ink)}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.badge{font-size:.77rem;font-weight:700;padding:5px 9px;border-radius:99px;display:inline-block}
.done{background:#e4f6ed;color:var(--green)}.partial{background:#fff1d8;color:var(--amber)}.todo{background:#e8edff;color:#3e56c4}.review{background:#fce9e9;color:var(--red)}
h2{font-size:1.06rem;margin:22px 2px 10px}
.grid{display:grid;grid-template-columns:1fr;gap:9px}
.card{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.card:active{transform:scale(.99)}.card.selected{border-color:var(--blue);background:#f0f3ff}
.card input{width:21px;height:21px;accent-color:var(--blue);margin:2px 0 0;flex-shrink:0}
.title{font-weight:700;line-height:1.4}.description{font-size:.86rem;color:var(--muted);margin-top:4px;line-height:1.5}
.status{margin-top:8px}
.panel{position:sticky;bottom:8px;background:#ffffffef;backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:17px;padding:13px;margin-top:20px;box-shadow:0 8px 25px #24304412}
#selectedText{width:100%;min-height:100px;margin-top:10px;border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit;resize:vertical}
.small{font-size:.8rem}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main>
<header class="hero">
<h1>🌷 Nurse＋ 機能追加ロードマップ</h1>
<p>追加済みの機能と、これから追加する候補をまとめています。未追加候補のカードをタップして、次に実装したい機能を選んでください。</p>
<p class="small">このページで選んだ内容はブラウザに保存されます。選択後に「選択内容をコピー」を押し、この会話に貼り付けると、選択した機能の実装に進めます。</p>
</header>
<div class="legend"><span class="badge done">追加済み・確認済み</span><span class="badge partial">一部追加／確認中</span><span class="badge review">作業中・PR確認中</span><span class="badge todo">未追加候補</span></div>
<div class="toolbar"><button class="soft" id="selectAll">未追加・一部追加をすべて選択</button><button class="soft" id="clear">選択解除</button></div>
<div id="featureGroups"></div>
<section class="panel">
<div id="count" style="font-weight:750">0件選択中</div>
<button class="primary" id="copy" style="margin-top:9px">選択内容をコピー</button>
<textarea id="selectedText" readonly placeholder="選択した機能がここに表示されます"></textarea>
<p id="message" class="small">選択した機能だけを次の実装候補として送れます。</p>
</section>
</main>
<script>
const groups=[
{title:"📚 問題演習・復習",items:[
{id:"wrong-review",name:"間違えた問題だけを復習",status:"todo",desc:"誤答した問題をまとめて解き直す"},
{id:"weakness",name:"苦手科目・苦手分野の自動分析",status:"partial",desc:"既存の学習統計との重複を確認してから拡張"},
{id:"favorites",name:"お気に入り問題の登録・一覧",status:"todo",desc:"重要な問題を保存してあとから復習"},
{id:"search",name:"科目・問題文からの検索",status:"todo",desc:"問題や科目をすばやく探す"},
{id:"ai-questions",name:"AIによる問題の自動生成",status:"todo",desc:"指定した科目・範囲から新しい問題を作成"},
{id:"review-recommend",name:"次に復習する問題のおすすめ",status:"todo",desc:"学習結果をもとに復習候補を提案"}
]},
{title:"📊 学習管理・データ",items:[
{id:"analytics",name:"学習回数・正答率・7日間の学習状況",status:"done",desc:"学習分析の基本表示は追加済み"},
{id:"subject-stats",name:"科目別正答率の表示",status:"done",desc:"科目ごとの正答率表示は追加済み"},
{id:"accuracy-animation",name:"正答率のカウントアップ演出",status:"done",desc:"結果表示の演出を追加済み"},
{id:"goals",name:"学習目標の設定・管理",status:"partial",desc:"一部表示あり。目標設定の範囲を確認して拡張"},
{id:"streak",name:"連続学習日数の管理",status:"partial",desc:"一部表示あり。記録方法・表示を確認"},
{id:"history-search",name:"演習履歴の検索・絞り込み",status:"todo",desc:"過去の結果を条件で探す"},
{id:"backup",name:"学習データのバックアップ・復元",status:"todo",desc:"端末変更やデータ消失に備える"},
{id:"sync",name:"複数端末間での学習データ同期",status:"todo",desc:"端末を変えても学習状況を引き継ぐ"},
{id:"reports",name:"週別・月別の学習レポート",status:"todo",desc:"期間ごとの学習量や正答率を確認"}
]},
{title:"👤 アカウント・LINE連携",items:[
{id:"line-login",name:"LINEログインの改善",status:"partial",desc:"別リポジトリのバックエンドで開発中"},
{id:"access-log",name:"アクセス日時・利用回数の記録",status:"partial",desc:"バックエンド側の連携・表示を確認"},
{id:"user-study-data",name:"利用者ごとの学習データ管理",status:"todo",desc:"利用者ごとに学習記録を管理。保存設計の確認が必要"}
]},
{title:"🔔 お知らせ・通知",items:[
{id:"line-notice",name:"公式LINE通知との連携",status:"done",desc:"既存の通知機能は稼働確認済み。変更時は既存動作を保護"},
{id:"scheduled-notice",name:"お知らせの予約配信",status:"partial",desc:"関連機能の状況を確認してから追加"},
{id:"notice-history",name:"お知らせ履歴の検索・絞り込み",status:"partial",desc:"通知アーカイブを活用できるか確認"},
{id:"notice-preview",name:"お知らせのプレビュー",status:"todo",desc:"配信前に表示内容を確認"},
{id:"emergency-stop",name:"緊急時の通知停止ボタン",status:"partial",desc:"管理機能との重複を確認して安全に追加"}
]},
{title:"🎨 デザイン・操作性",items:[
{id:"timer",name:"問題の制限時間・残り秒数表示",status:"done",desc:"制限時間の表示を修正・反映済み"},
{id:"animations",name:"画面・カードアニメーションの改善",status:"review",desc:"表示速度と出現パターン変更のPRが未反映"},
{id:"dark-mode",name:"ダークモード",status:"todo",desc:"暗い画面テーマを切り替える"},
{id:"mobile-ux",name:"スマホでの操作性の改善",status:"todo",desc:"操作や表示を実機で確認し改善"}
]},
{title:"🛠️ 管理者向け機能",items:[
{id:"admin-dashboard",name:"利用状況ダッシュボードの拡張",status:"partial",desc:"既存の学習分析と管理機能を確認して拡張"},
{id:"question-admin",name:"問題データの追加・編集管理",status:"todo",desc:"問題を管理しやすくする"},
{id:"audit-log",name:"管理者の操作履歴・監査ログ",status:"todo",desc:"管理操作を追跡できるようにする"},
{id:"approval-flow",name:"お知らせの承認フロー",status:"todo",desc:"配信前に内容を確認・承認する"}
]}
];
const labels={done:"追加済み・確認済み",partial:"一部追加／確認中",todo:"未追加候補",review:"作業中・PR確認中"};
const root=document.getElementById("featureGroups");
for(const group of groups){
 const section=document.createElement("section");const h=document.createElement("h2");h.textContent=group.title;section.appendChild(h);
 const grid=document.createElement("div");grid.className="grid";
 for(const item of group.items){
  const card=document.createElement("label");card.className="card";if(item.status==="done"||item.status==="review")card.style.cursor="default";
  const cb=document.createElement("input");cb.type="checkbox";cb.value=item.id;cb.dataset.name=item.name;cb.disabled=item.status==="done"||item.status==="review";
  const body=document.createElement("div");body.style.flex="1";
  const title=document.createElement("div");title.className="title";title.textContent=item.name;
  const desc=document.createElement("div");desc.className="description";desc.textContent=item.desc;
  const badge=document.createElement("span");badge.className="badge "+item.status+" status";badge.textContent=labels[item.status];
  body.append(title,desc,badge);card.append(cb,body);grid.appendChild(card);
  cb.addEventListener("change",()=>{card.classList.toggle("selected",cb.checked);save();});
 }
 section.appendChild(grid);root.appendChild(section);
}
function chosen(){return [...document.querySelectorAll('input[type=checkbox]:checked')]}
function save(){
 const items=chosen();localStorage.setItem("nursePlusFeatureRoadmapSelection",JSON.stringify(items.map(x=>x.value)));
 document.getElementById("count").textContent=items.length+"件選択中";
 document.getElementById("selectedText").value=items.length?"Nurse＋ 次に実装したい機能：\n"+items.map(x=>"・"+x.dataset.name).join("\n"):"";
}
function load(){try{const ids=JSON.parse(localStorage.getItem("nursePlusFeatureRoadmapSelection")||"[]");document.querySelectorAll('input[type=checkbox]').forEach(x=>{x.checked=ids.includes(x.value);x.closest(".card").classList.toggle("selected",x.checked)})}catch(e){}save()}
document.getElementById("selectAll").onclick=()=>{document.querySelectorAll('input[type=checkbox]:not(:disabled)').forEach(x=>{x.checked=true;x.closest(".card").classList.add("selected")});save()};
document.getElementById("clear").onclick=()=>{document.querySelectorAll('input[type=checkbox]').forEach(x=>{x.checked=false;x.closest(".card").classList.remove("selected")});save()};
document.getElementById("copy").onclick=async()=>{const box=document.getElementById("selectedText");if(!box.value){document.getElementById("message").textContent="先に未追加候補をタップして選んでください。";return}try{await navigator.clipboard.writeText(box.value);document.getElementById("message").textContent="コピーしました。この会話に貼り付けてください。"}catch(e){box.focus();box.select();document.getElementById("message").textContent="自動コピーできません。文章を長押ししてコピーしてください。"}};
load();
</script></body></html>
