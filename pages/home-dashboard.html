<div id="screen-dashboard" class="space-y-4">
        <div>
          <div class="en-title text-[10px] text-amber-500 tracking-[.22em] font-semibold">STUDY HOME</div>
          <h2 class="serif-title text-xl text-slate-100 mt-1">学習ホーム</h2>
          <p class="text-[11px] text-slate-400 mt-1">現在の学習状況を確認できます。</p>
          <button onclick="showSubjectScreen()" class="w-full mt-3 py-2.5 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 text-xs font-medium transition">
            科目一覧
          </button>
        </div>

        <div class="evo-card">
          <div class="flex justify-between items-center mb-3">
            <span class="text-xs font-semibold text-slate-200">科目別コンディション</span>
            <div class="flex items-center gap-1.5">
              <button onclick="evoConditionPrevDate()" id="evo-condition-prev" class="px-2 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-[10px] transition">‹</button>
              <span id="evo-condition-date" class="text-[10px] text-slate-500 min-w-[76px] text-center">--</span>
              <button onclick="evoConditionNextDate()" id="evo-condition-next" class="px-2 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-[10px] transition">›</button>
            </div>
          </div>
          <div id="evo-subjects" class="space-y-3"></div>
        </div>

        <div class="evo-card">
          <div class="flex items-center justify-between gap-3 mb-4">
            <div>
              <div class="text-xs font-semibold text-slate-200">学習ログ</div>
              <div class="text-[10px] text-slate-500 mt-1">これまでの学習実績</div>
            </div>
            <span class="evo-chip">LOCAL DATA</span>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-y-4">
            <div class="text-center px-2">
              <div class="text-[10px] text-slate-500 mb-1.5">演習回数</div>
              <div id="evo-total-attempts" class="text-xl font-mono font-bold text-slate-100 leading-none">0</div>
            </div>
            <div class="text-center px-2 sm:border-l sm:border-slate-700/60">
              <div class="text-[10px] text-slate-500 mb-1.5">平均正答率</div>
              <div id="evo-avg" class="text-xl font-mono font-bold text-amber-400 leading-none">--</div>
            </div>
            <div class="text-center px-2 border-t border-slate-700/50 pt-4 sm:border-t-0 sm:border-l sm:pt-0">
              <div class="text-[10px] text-slate-500 mb-1.5">最高記録</div>
              <div id="evo-best" class="text-xl font-mono font-bold text-slate-100 leading-none">--</div>
            </div>
            <div class="text-center px-2 border-t border-slate-700/50 pt-4 sm:border-t-0 sm:border-l sm:pt-0">
              <div class="text-[10px] text-slate-500 mb-1.5">連続学習</div>
              <div class="text-xl font-mono font-bold text-emerald-400 leading-none"><span id="evo-streak">0</span><span class="text-xs ml-1">日</span></div>
            </div>
          </div>
        </div>



      </div>
