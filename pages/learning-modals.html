<div id="modal-learned-words" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center z-50 p-4 overflow-y-auto">
    <div class="glass-card w-full max-w-md rounded-2xl p-5 space-y-4 border border-slate-700/60 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700/50">
        <div class="flex items-center gap-1.5">
          <h3 class="serif-title text-base font-medium text-slate-100">覚えた単語・用語一覧</h3>
        </div>
        <button onclick="closeLearnedWordsModal()" class="text-slate-400 text-xs hover:text-white p-1">✕</button>
      </div>
      <div id="learned-words-list-container" class="space-y-2 text-xs leading-relaxed max-h-64 overflow-y-auto custom-scrollbar pr-1">
      </div>
      <div class="pt-2 flex justify-end">
        <button onclick="closeLearnedWordsModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-xs hover:bg-slate-700 transition">閉じる</button>
      </div>
    </div>
  </div>

  <!-- お知らせ用モーダル -->
  <div id="modal-notice" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center z-50 p-4 overflow-y-auto">
    <div class="glass-card w-full max-w-sm rounded-2xl p-5 space-y-4 border border-slate-700/60 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700/50">
        <div class="flex items-center gap-1.5">
          <span>🔔</span>
          <h3 class="serif-title text-base font-medium text-slate-100">お知らせ</h3>
        </div>
        <button onclick="closeNoticeModal()" class="text-slate-400 text-xs hover:text-white p-1">✕</button>
      </div>
      <div id="notice-list-container" class="space-y-3 text-xs leading-relaxed text-slate-300 max-h-60 overflow-y-auto">
        <div class="p-3 rounded-xl bg-slate-900/80 border border-slate-800 space-y-1">
          <div class="text-[10px] text-amber-400 font-mono">新機能アップデート</div>
          <div class="font-semibold text-slate-100">演習機能が新しくなりました</div>
          <p class="text-slate-400 text-[11px] font-light">画像の表示、複数選択問題、早押し対戦（2Pマルチ）に対応しました。</p>
        </div>
      </div>
      <button onclick="closeNoticeModal()" class="w-full py-2 bg-slate-800 text-slate-300 rounded-lg text-xs hover:bg-slate-700 transition">閉じる</button>
    </div>
  </div>

  <!-- 管理者パスワードモーダル -->
  <div id="modal-auth" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center z-[80] p-4 overflow-y-auto">
    <div class="glass-card w-full max-w-sm rounded-2xl p-5 space-y-4 border border-slate-700/60 shadow-2xl">
      <div class="text-center space-y-1">
        <div class="en-title text-[10px] text-amber-500/80 tracking-widest uppercase font-semibold">AUTHENTICATION</div>
        <h3 class="serif-title text-lg text-slate-100">管理者認証</h3>
      </div>
      <input type="password" id="admin-password-input" placeholder="パスワードを入力" autocomplete="current-password" onkeydown="if(event.key==='Enter'){event.preventDefault();submitPassword()}" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-100 text-sm text-center tracking-widest focus:outline-none focus:border-amber-600">
      <div id="auth-error-msg" class="text-center text-[11px] text-rose-400 font-light hidden">パスワードが正しくありません</div>
      <div class="flex gap-2.5">
        <button onclick="closeAuthModal()" class="w-1/2 py-2 bg-slate-800 text-slate-300 rounded-lg text-xs hover:bg-slate-700 transition">キャンセル</button>
        <button id="admin-auth-submit" type="button" onclick="submitPassword()" class="w-1/2 py-2 bg-amber-700 text-amber-50 rounded-lg text-xs hover:bg-amber-600 transition font-semibold">認証する</button>
      </div>
    </div>
  </div>
